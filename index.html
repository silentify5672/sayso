<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sayso — learn a language by actually talking</title>
<meta name="description" content="Learn 8 languages through real conversations, script lessons and gentle, guilt-free practice.">
<meta name="theme-color" content="#FF6B4A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sayso">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF7EE;--ink:#1F1B2E;--mut:#7A7287;--line:#EADFD3;--coral:#FF6B4A;--coralD:#D9492B;--vio:#6C5CE7;--vioD:#4E3FC4;--vioL:#EFECFF;--good:#22A866;--goodD:#17824D;--goodL:#DDF6E8;--bad:#E5484D;--badD:#B8323A;--badL:#FDE4E4;--gold:#FFB703;--goldD:#D99500}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg)}
h1,h2,h3{font-family:Fredoka,Nunito,sans-serif;font-weight:600;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.mut{color:var(--mut);font-weight:700;line-height:1.4}

/* top + tabs */
.top{display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;border-bottom:2px solid var(--line)}
.logo{display:flex;align-items:center;gap:7px;font-family:Fredoka;font-weight:700;font-size:22px;color:var(--coral);flex:1}
.logo svg{width:30px}
.chip{display:flex;align-items:center;gap:4px;font-weight:900;font-size:15px;padding:5px 9px;border-radius:12px;background:#fff;border:2px solid var(--line)}
.ring{width:38px;height:38px;position:relative;display:grid;place-items:center;font-size:15px}
.ring svg{position:absolute;inset:0}
.scroll{flex:1;overflow-y:auto;padding:18px 16px 30px}
.tabs{display:flex;border-top:2px solid var(--line);background:#fff;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px;border-radius:14px;font-weight:900;font-size:12px;color:var(--mut);position:relative}
.tabs button.on{color:var(--coral);background:#FFF0EB}
.tabs .ic{font-size:22px}
.badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}

/* buttons */
.btn{display:block;width:100%;padding:14px 18px;border-radius:16px;font-weight:900;font-size:16px;letter-spacing:.5px;text-transform:uppercase;transition:transform .06s,box-shadow .06s}
.btn:active:not(:disabled){transform:translateY(4px)}
.btn.pri{background:var(--coral);color:#fff;box-shadow:0 5px 0 var(--coralD)}
.btn.pri:active:not(:disabled){box-shadow:0 1px 0 var(--coralD)}
.btn.good{background:var(--good);color:#fff;box-shadow:0 5px 0 var(--goodD)}
.btn.bad{background:var(--bad);color:#fff;box-shadow:0 5px 0 var(--badD)}
.btn.ghost{background:#fff;color:var(--vio);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn:disabled{background:#E7E1DA;color:#AFA6B8;box-shadow:0 5px 0 #D4CCC3;cursor:default}

/* learn */
.unit{background:var(--vio);color:#fff;border-radius:20px;padding:14px 16px;box-shadow:0 5px 0 var(--vioD);display:flex;align-items:center;gap:12px;margin-bottom:14px}
.unit svg{width:52px;flex:none}
.unit small{opacity:.85;font-weight:900;text-transform:uppercase;font-size:11.5px;letter-spacing:1px}
.unit h3{font-size:20px;margin-top:2px}
.goal{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px;margin-bottom:28px}
.gbar{flex:1;height:12px;background:#EDE5DC;border-radius:8px;overflow:hidden}
.gbar i{display:block;height:100%;background:var(--gold);border-radius:8px}
.path{display:flex;flex-direction:column;align-items:center;gap:30px;padding:24px 0 10px}
.nodewrap{display:flex;flex-direction:column;align-items:center;gap:8px;transform:translateX(var(--off))}
.node{position:relative;width:78px;height:72px;border-radius:50%;font-size:32px;display:grid;place-items:center;background:var(--c);box-shadow:0 7px 0 color-mix(in srgb,var(--c) 68%,#000)}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 color-mix(in srgb,var(--c) 68%,#000)}
.node.locked{--c:#DDD5CC !important;filter:grayscale(1);opacity:.75}
.node.done::after{content:'✓';position:absolute;right:-5px;bottom:-5px;background:var(--gold);color:#fff;width:28px;height:28px;border-radius:50%;font-size:15px;font-weight:900;display:grid;place-items:center;border:3px solid var(--bg)}
.node.cur{animation:bob 1.6s ease-in-out infinite}
.start{position:absolute;top:-40px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--line);color:var(--coral);font-weight:900;font-size:13px;padding:5px 11px;border-radius:10px;white-space:nowrap;font-family:Nunito}
.nlabel{font-weight:900;font-size:13px;color:var(--mut)}
.more{text-align:center;margin-top:34px;padding:16px;border:2px dashed var(--line);border-radius:18px}

/* cards */
.card{background:#fff;border:2px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 4px 0 var(--line)}
.card h3{font-size:19px;margin-bottom:8px}
.card .btn{margin-top:14px}
.feat{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:2px dashed var(--line)}
.feat:first-of-type{border-top:none}
.feat .fi{font-size:26px;width:36px;text-align:center;flex:none}
.feat b{display:block;font-size:15.5px}
.feat p{color:var(--mut);font-size:14px;line-height:1.4;font-weight:700}
.weak{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:2px dashed var(--line);font-weight:800;font-size:15px}
.dots{flex:none}
.dots i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#E7E1DA;margin-left:3px}
.dots i.on{background:var(--good)}

/* lesson */
.lesson{display:flex;flex-direction:column;height:100%}
.lbar{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 16px 6px}
.x{font-size:22px;color:var(--mut);padding:4px 6px;font-weight:900}
.prog{flex:1;height:16px;background:#EDE5DC;border-radius:10px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--good);border-radius:10px;transition:width .4s;box-shadow:inset 0 4px 0 rgba(255,255,255,.3)}
.combo{font-weight:900;color:#C9C0B6;font-size:15px;min-width:42px;text-align:right}
.combo.on{color:var(--coral);animation:pop .3s}
.ex{flex:1;overflow-y:auto;padding:14px 18px 20px}
.ex h2{font-size:24px;margin:4px 0 18px}
.grid.pics{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid.list{display:flex;flex-direction:column;gap:10px}
.opt{background:#fff;border:2px solid var(--line);border-radius:16px;box-shadow:0 4px 0 var(--line);padding:14px 16px;font-weight:800;font-size:17px;text-align:left;display:flex;align-items:center;gap:10px}
.pics .opt{flex-direction:column;justify-content:center;padding:18px 10px;text-align:center}
.em{font-size:46px;line-height:1}
.opt.sel{border-color:var(--vio);background:var(--vioL);box-shadow:0 4px 0 var(--vio);color:var(--vioD)}
.opt.right{border-color:var(--good);background:var(--goodL);box-shadow:0 4px 0 var(--good);color:var(--goodD)}
.opt.wrong{border-color:var(--bad);background:var(--badL);box-shadow:0 4px 0 var(--bad);color:var(--badD)}
.speak{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin:6px 0 26px}
.speak .big{width:100px;height:100px;border-radius:26px;background:var(--vio);box-shadow:0 6px 0 var(--vioD);font-size:44px}
.speak .slow{width:64px;height:64px;border-radius:18px;background:var(--vioL);box-shadow:0 5px 0 #CFC8FA;font-size:28px}
.srcrow{display:flex;gap:10px;align-items:center;margin-bottom:22px}
.srcrow svg{width:66px;flex:none}
.bubble{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px}
.bubble button{font-size:18px}
.answer{min-height:120px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;padding:10px;margin-bottom:22px;border:2px dashed var(--line);border-radius:16px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tok{background:#fff;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);border-radius:12px;padding:9px 13px;font-weight:800;font-size:17px;min-height:46px}
.tok.ghost{background:#EDE5DC;color:transparent;box-shadow:none;border-color:#EDE5DC}
.tok.ghost .rom{visibility:hidden}
.answer.right .tok{border-color:var(--good);color:var(--goodD)}
.answer.wrong .tok{border-color:var(--bad);color:var(--badD)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match>div{display:flex;flex-direction:column;gap:10px}
.mt{width:100%;height:auto;padding:15px 8px;text-align:center}
.mt.sel{border-color:var(--vio);background:var(--vioL);box-shadow:0 3px 0 var(--vio)}
.mt.gone{opacity:.4;box-shadow:none;pointer-events:none;border-color:var(--good);background:var(--goodL)}
.mt.err{border-color:var(--bad);background:var(--badL);animation:shake .3s}
.foot{padding:14px 18px calc(18px + env(safe-area-inset-bottom));border-top:2px solid var(--line);transition:background .2s}
.foot.good{background:var(--goodL);border-color:transparent}
.foot.bad{background:var(--badL);border-color:transparent}
.fbt{font-family:Fredoka;font-weight:600;font-size:22px;display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.foot.good .fbt{color:var(--goodD)}
.foot.bad .fbt{color:var(--badD)}
.foot p{font-size:15px;margin-bottom:8px;line-height:1.4;font-weight:700}
.why{background:rgba(255,255,255,.75);border-radius:12px;padding:10px 12px;font-size:14.5px;margin:6px 0 12px;line-height:1.45;font-weight:700}
.saved{font-size:13.5px !important;color:var(--badD)}
.x2{background:var(--coral);color:#fff;font-size:12px;font-family:Nunito;font-weight:900;padding:3px 8px;border-radius:8px}

/* convo */
.convo-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.av{width:50px;height:50px;border-radius:50%;background:#FFE3D9;display:grid;place-items:center;font-size:28px;flex:none}
.convo-head b{font-family:Fredoka;font-size:19px;font-weight:600}
.convo-head small{display:block;color:var(--mut);font-weight:800;font-size:13px}
.tapt{font-size:12.5px;color:var(--mut);font-weight:800;margin:6px 0 14px}
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.b{max-width:84%;padding:10px 14px;border-radius:18px;font-weight:800;font-size:16.5px;line-height:1.35;animation:pop .25s}
.b.npc{align-self:flex-start;background:#fff;border:2px solid var(--line);border-bottom-left-radius:6px;cursor:pointer}
.b.npc small.en{display:none;color:var(--mut);font-weight:700;font-size:14px;margin-top:4px}
.b.npc.show small.en{display:block}
.b.npc .sp{margin-left:4px;font-size:15px}
.b.me{align-self:flex-end;background:var(--vio);color:#fff;border-bottom-right-radius:6px}
.replies{display:flex;flex-direction:column;gap:9px}
.reply{font-size:16px;padding:12px 14px}
.reply.bad{border-color:var(--bad);background:var(--badL);box-shadow:0 4px 0 var(--bad);animation:shake .3s}
.hint{margin-top:12px;background:#FFF4D6;border:2px solid #FFE3A1;border-radius:14px;padding:10px 12px;font-weight:800;font-size:14.5px;line-height:1.4}

/* finish */
.finish{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:8px;overflow-y:auto}
.finish svg.m{width:130px;animation:bob 1.6s ease-in-out infinite;margin-bottom:6px}
.finish h1{font-size:32px;color:var(--coral)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin:16px 0}
.stat{border-radius:16px;border:2px solid var(--c);overflow:hidden;background:#fff}
.stat b{display:block;background:var(--c);color:#fff;font-size:11.5px;text-transform:uppercase;letter-spacing:1px;padding:4px;font-weight:900}
.stat span{display:block;font-family:Fredoka;font-size:25px;font-weight:600;padding:10px;color:var(--ink)}

/* overlays */
.ov{position:absolute;inset:0;background:rgba(31,27,46,.45);display:flex;align-items:flex-end;z-index:20;animation:fade .2s}
.sheet{background:#fff;width:100%;border-radius:26px 26px 0 0;padding:24px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;text-align:center;animation:up .25s}
.sheet h2{font-size:24px}
.bigem{width:84px;height:84px;border-radius:50%;margin:0 auto 4px;display:grid;place-items:center;font-size:40px}
.pills{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:6px}
.pills span{background:var(--vioL);color:var(--vioD);font-weight:800;font-size:13.5px;padding:5px 10px;border-radius:10px}
.toast{position:absolute;top:76px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:800;font-size:14px;z-index:30;animation:pop .2s;white-space:nowrap}
.cf{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;z-index:25;animation:fall var(--d) cubic-bezier(.3,.6,.6,1) forwards;pointer-events:none}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fall{to{transform:translate(var(--x),105vh) rotate(var(--r))}}
.toast{transform:translateX(-50%)}
.sheet{max-height:88%;overflow-y:auto}
.welcome{flex:1;overflow-y:auto;padding:calc(40px + env(safe-area-inset-top)) 20px 30px;text-align:center}
.welcome .wm{width:120px;animation:bob 1.6s ease-in-out infinite}
.welcome h1{font-size:30px;color:var(--coral);margin:8px 0 4px}
.langs{display:flex;flex-direction:column;gap:10px;margin-top:16px;text-align:left}
.lang{display:flex;align-items:center;gap:14px;width:100%;background:#fff;border:2px solid var(--line);border-radius:18px;box-shadow:0 4px 0 var(--line);padding:12px 16px;text-align:left}
.lang .fl{font-size:36px;line-height:1}
.lang b{font-family:Fredoka;font-size:19px;font-weight:600;display:block}
.lang small{color:var(--mut);font-weight:800;font-size:13.5px}
.lang.on{border-color:var(--vio);box-shadow:0 4px 0 var(--vio);background:var(--vioL)}
.lang .tick{color:var(--vio);font-weight:900;font-size:20px}
.lang.soon{opacity:.5;box-shadow:none;border-style:dashed}
.top .chip{padding:5px 8px}

.tl{display:inline-flex;flex-direction:column;align-items:flex-start;line-height:1.2;vertical-align:middle}
.rom{font-size:.66em;font-weight:700;color:var(--mut);margin-top:2px;letter-spacing:.1px}
.pics .opt .tl,.tok .tl,.mt .tl{align-items:center}
.b.me .rom{color:#DCD6FF}
.opt.sel .rom{color:var(--vio)}
.pills .rom{font-size:.8em}
.romt{font-weight:900;font-size:13px;padding:4px 8px;border-radius:9px;border:2px solid var(--line);color:var(--mut);background:#fff}
.romt.on{border-color:var(--vio);color:var(--vio);background:var(--vioL)}
.lc{font-size:11px;font-weight:900;color:var(--mut);margin-left:2px}
.lgroup{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:var(--mut);margin:10px 4px 0}
.lgroup:first-child{margin-top:0}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---------- content ---------- */
const COURSES = {
es:{ name:'Spanish', flag:'🇪🇸', voice:'es-ES', hello:'¡Hola!', unit:'Survive your first trip', group:'European languages', lessons:[
{ id:'greet', title:'First Hellos', emoji:'👋', color:'#FF6B4A',
  desc:'Say hi, introduce yourself, and finish with a real chat with Lucía at a hostel.',
  words:['hola','buenos días','¿cómo estás?','me llamo','gracias'],
  ex:[
  {t:'choice', prompt:'Which one means “hello”?', options:[{e:'👋',w:'hola'},{e:'🚪',w:'adiós'},{e:'🙏',w:'gracias'},{e:'🥺',w:'por favor'}], answer:0,
   tip:'“Hola” works any time of day, with friends or strangers. The h is silent: “OH-la”.'},
  {t:'listen', say:'Buenos días', options:['Good morning','Good night','Good afternoon'], answer:0,
   tip:'Greetings are plural in Spanish: buenos días (morning), buenas tardes (afternoon), buenas noches (night).'},
  {t:'build', src:'Good night, Ana', answer:'Buenas noches, Ana', extra:['días','Buenos'],
   tip:'“Noche” is feminine, so it takes “buenas”, not “buenos”.'},
  {t:'match', pairs:[['hola','hello'],['adiós','goodbye'],['gracias','thank you'],['por favor','please'],['sí','yes']]},
  {t:'choice', prompt:'What does this mean?', es:'¿Cómo estás?', options:['How are you?','Where are you?','Who are you?'], answer:0,
   tip:'cómo = how, estás = you are. Notice the upside-down ¿ that opens every question.'},
  {t:'build', src:'I am well, thanks', answer:'Estoy bien, gracias', extra:['Soy','mal'],
   tip:'Use estar (estoy) for how you feel right now. Ser (soy) is for permanent things like where you are from.'},
  {t:'convo', npc:'Lucía', npcEmoji:'👩🏽', scene:'Meeting someone at a hostel',
   tip:'You just held your first real conversation in Spanish!',
   turns:[
    {npc:'¡Hola! Me llamo Lucía. ¿Cómo te llamas?', en:'Hi! I’m Lucía. What’s your name?', choices:[
      {es:'Tengo veinte años.', fb:'That means “I’m 20 years old”. She asked your name. Try “Me llamo…”.'},
      {es:'Me llamo Alex.', ok:true},
      {es:'Adiós, Lucía.', fb:'You just said goodbye before saying hello! 😄'}]},
    {npc:'¡Mucho gusto, Alex! ¿Cómo estás?', en:'Nice to meet you, Alex! How are you?', choices:[
      {es:'Muy bien, ¿y tú?', ok:true},
      {es:'Me llamo bien.', fb:'“Me llamo” is only for names. For how you feel, use “estoy” or just “bien”.'}]},
    {npc:'¡Genial! Bueno, hasta luego.', en:'Great! Well, see you later.', choices:[
      {es:'¿Cómo te llamas?', fb:'You already know her name: Lucía!'},
      {es:'¡Hasta luego!', ok:true}]}
   ]}
  ]},
{ id:'cafe', title:'At the Café', emoji:'☕', color:'#C0763A',
  desc:'Order like a local, ask the price, and pay. Ends with ordering from Marta the barista.',
  words:['un café','con leche','para llevar','la cuenta','¿cuánto cuesta?'],
  ex:[
  {t:'choice', prompt:'Which one is “coffee”?', options:[{e:'💧',w:'el agua'},{e:'☕',w:'el café'},{e:'🥐',w:'el cruasán'},{e:'🍵',w:'el té'}], answer:1,
   tip:'“Café” means both the drink and the place. Stress the last syllable: ca-FÉ.'},
  {t:'listen', say:'Un agua, por favor', options:['A coffee, please','A water, please','The bill, please'], answer:1,
   tip:'“Agua” is feminine, but it uses “un/el” in the singular because it starts with a stressed “a”.'},
  {t:'build', src:'A coffee with milk, please', answer:'Un café con leche, por favor', extra:['té','sin'],
   tip:'con = with, sin = without. A “café con leche” is the classic Spanish breakfast coffee.'},
  {t:'match', pairs:[['café','coffee'],['leche','milk'],['té','tea'],['la cuenta','the bill'],['agua','water']]},
  {t:'choice', prompt:'What does this mean?', es:'¿Cuánto cuesta?', options:['What time is it?','How much does it cost?','How many are there?'], answer:1,
   tip:'cuánto = how much. For more than one thing, say “¿Cuánto cuestan?”.'},
  {t:'listen', say:'La cuenta, por favor', options:['The menu, please','The table, please','The bill, please'], answer:2,
   tip:'In Spain, waiters usually won’t bring the bill until you ask. “La cuenta, por favor” is the magic phrase.'},
  {t:'convo', npc:'Marta', npcEmoji:'👩🏻‍🍳', scene:'Ordering at a café in Madrid',
   tip:'Order placed and paid, all in Spanish. ☕',
   turns:[

{ id:'greet', title:'First Hellos', emoji:'👋', color:'#FF6B4A',

   tip:'こんにちは (konnichiwa) is the daytime hello. In the morning, say おはよう (ohayō).'},
  {t:'listen', say:'おはようございます|Ohayō gozaimasu', options:['Good morning','Good night','Goodbye'], answer:0,
   tip:'おはよう (ohayō) is casual. Adding ございます (gozaimasu) makes it polite, which is best with strangers.'},
  {t:'build', src:'Thank you very much', answer:['どうも|dōmo','ありがとう|arigatō','ございます|gozaimasu'], extra:['すみません|sumimasen','こんにちは|konnichiwa'],
   tip:'どうもありがとうございます is the most polite everyday thank-you. Just ありがとう (arigatō) is fine with friends.'},
  {t:'match', pairs:[['こんにちは|konnichiwa','hello'],['さようなら|sayōnara','goodbye'],['ありがとう|arigatō','thank you'],['はい|hai','yes'],['いいえ|iie','no']]},
  {t:'choice', prompt:'What does this mean?', es:'お元気ですか？|O-genki desu ka?', options:['How are you?','Where are you?','Who are you?'], answer:0,
   tip:'か (ka) at the end turns a sentence into a question, like a spoken question mark.'},
  {t:'build', src:'I am Alex', answer:['わたし|watashi','は|wa','アレックス|Arekkusu','です|desu'], extra:['か|ka','を|o'],
   tip:'は is pronounced “wa” when it marks the topic. Foreign names are written in katakana: アレックス (Arekkusu).'},

   tip:'You just held your first real conversation in Japanese!',
   turns:[

      {es:'さようなら。|Sayōnara.', fb:'You just said goodbye before saying hello! 😄'}]},
    {npc:'よろしくお願いします！|Yoroshiku onegaishimasu!', en:'Nice to meet you!', choices:[

    {npc:'じゃあ、またね！|Jā, mata ne!', en:'Well, see you!', choices:[
      {es:'お名前は？|O-namae wa?', fb:'You already know her name: Yui!'},
      {es:'またね！|Mata ne!', ok:true}]}
   ]}
  ]},

  {t:'listen', say:'どこから来ましたか？|Doko kara kimashita ka?', options:['Where are you going?','Where do you live?','Where are you from?'], answer:2,
   tip:'Literally “where did you come from?”. Answer: [country] から来ました (kara kimashita).'},
  {t:'match', pairs:[['犬|inu','dog'],['猫|neko','cat'],['音楽|ongaku','music'],['本|hon','book'],['海|umi','sea']]},
  {t:'choice', prompt:'How do you say “I’m from Australia”?', options:['オーストラリアに行きます|Ōsutoraria ni ikimasu','オーストラリアから来ました|Ōsutoraria kara kimashita','オーストラリアが好きです|Ōsutoraria ga suki desu'], answer:1,
   tip:'から (kara) = from, 来ました (kimashita) = came. The first option means “I’m going to Australia”.'},
  {t:'build', src:'Do you want to go to the sea?', answer:['海|umi','に|ni','行きません|ikimasen','か|ka'], extra:['家|ie','行きます|ikimasu'],
   tip:'Japanese invites with a negative question: 行きませんか？ (“won’t you go?”) sounds friendly, not pushy.'},
  {t:'convo', npc:'Haruto', npcEmoji:'🧑🏻', scene:'At a friend’s party',
   tip:'New friend unlocked. Sea trip on Saturday! 🌊',
   turns:[
    {npc:'こんにちは！どこから来ましたか？|Konnichiwa! Doko kara kimashita ka?', en:'Hi! Where are you from?', choices:[
      {es:'オーストラリアに行きます。|Ōsutoraria ni ikimasu.', fb:'That means “I’m going to Australia”. Use から来ました (kara kimashita).'},
      {es:'オーストラリアから来ました。|Ōsutoraria kara kimashita.', ok:true}]},
    {npc:'そうですか！何が好きですか？|Sō desu ka! Nani ga suki desu ka?', en:'Oh really! What do you like?', choices:[
      {es:'音楽と海が好きです。|Ongaku to umi ga suki desu.', ok:true},
      {es:'音楽を好きです。|Ongaku o suki desu.', fb:'With 好き (suki), the thing you like takes が (ga), not を (o).'}]},

   ]}
  ]}

ko:{ name:'Korean', flag:'🇰🇷', voice:'ko-KR', hello:'안녕하세요!|Annyeonghaseyo!', unit:'Survive your first trip', group:'East Asian languages', rom:true, lessons:[
{ id:'greet', title:'First Hellos', emoji:'👋', color:'#FF6B4A',
  desc:'Say hi, introduce yourself, and finish with a real chat with Minji at a hostel in Seoul.',
  words:['안녕하세요|annyeonghaseyo','감사합니다|gamsahamnida','잘 지내요?|jal jinaeyo?','제 이름은|je ireumeun'],
  ex:[
  {t:'choice', prompt:'Which one means “hello”?', options:[{e:'👋',w:'안녕하세요|annyeonghaseyo'},{e:'🚪',w:'안녕히 가세요|annyeonghi gaseyo'},{e:'🙏',w:'감사합니다|gamsahamnida'},{e:'🙇',w:'죄송합니다|joesonghamnida'}], answer:0,
   tip:'안녕하세요 works any time of day. With close friends, just say 안녕 (annyeong).'},
  {t:'listen', say:'감사합니다|Gamsahamnida', options:['Thank you','Sorry','Hello'], answer:0,
   tip:'감사합니다 is the polite thank-you. 고마워요 (gomawoyo) is a softer, friendlier version.'},
  {t:'build', src:'Nice to meet you', answer:['만나서|mannaseo','반가워요|bangawoyo'], extra:['안녕|annyeong','네|ne'],
   tip:'Literally “meeting you, I’m glad”. Use it right after introductions.'},
  {t:'match', pairs:[['안녕하세요|annyeonghaseyo','hello'],['감사합니다|gamsahamnida','thank you'],['네|ne','yes'],['아니요|aniyo','no'],['죄송합니다|joesonghamnida','sorry']]},
  {t:'choice', prompt:'What does this mean?', es:'잘 지내요?|Jal jinaeyo?', options:['How are you?','Where are you?','Who are you?'], answer:0,
   tip:'Literally “are you getting along well?”. The answer: 네, 잘 지내요 (ne, jal jinaeyo).'},
  {t:'build', src:'My name is Alex', answer:['제|je','이름은|ireumeun','알렉스예요|Allekseu-yeyo'], extra:['저는|jeoneun','뭐예요|mwoyeyo'],
   tip:'After a name ending in a vowel, add 예요 (yeyo). After a consonant, add 이에요 (ieyo).'},
  {t:'convo', npc:'Minji', npcEmoji:'👩🏻', scene:'Meeting someone at a hostel in Seoul',
   tip:'You just held your first real conversation in Korean!',
   turns:[
    {npc:'안녕하세요! 저는 민지예요. 이름이 뭐예요?|Annyeonghaseyo! Jeoneun Minji-yeyo. Ireumi mwoyeyo?', en:'Hi! I’m Minji. What’s your name?', choices:[
      {es:'스무 살이에요.|Seumu sarieyo.', fb:'That means “I’m 20 years old”. She asked your name!'},
      {es:'제 이름은 알렉스예요.|Je ireumeun Allekseu-yeyo.', ok:true},
      {es:'안녕히 가세요.|Annyeonghi gaseyo.', fb:'You just said goodbye before saying hello! 😄'}]},
    {npc:'만나서 반가워요! 잘 지내요?|Mannaseo bangawoyo! Jal jinaeyo?', en:'Nice to meet you! How are you?', choices:[
      {es:'네, 잘 지내요. 민지 씨는요?|Ne, jal jinaeyo. Minji ssi-neunyo?', ok:true},
      {es:'제 이름은 잘 지내요.|Je ireumeun jal jinaeyo.', fb:'“Je ireumeun” is only for your name!'}]},
    {npc:'좋아요! 나중에 봐요.|Joayo! Najunge bwayo.', en:'Great! See you later.', choices:[
      {es:'이름이 뭐예요?|Ireumi mwoyeyo?', fb:'You already know her name: Minji!'},
      {es:'네, 나중에 봐요!|Ne, najunge bwayo!', ok:true}]}
   ]}
  ]},
{ id:'cafe', title:'At the Café', emoji:'☕', color:'#C0763A',
  desc:'Order, ask the price, and pay. Ends with ordering from Junho at a café in Seoul.',
  words:['커피|keopi','주세요|juseyo','얼마예요?|eolmayeyo?','포장|pojang'],
  ex:[
  {t:'choice', prompt:'Which one is “coffee”?', options:[{e:'💧',w:'물|mul'},{e:'☕',w:'커피|keopi'},{e:'🍩',w:'도넛|doneot'},{e:'🍵',w:'차|cha'}], answer:1,
   tip:'Korea loves coffee! 아메리카노 (amerikano) is the most popular order.'},
  {t:'listen', say:'물 주세요|Mul juseyo', options:['Coffee, please','Water, please','The bill, please'], answer:1,
   tip:'[thing] 주세요 (juseyo) = “[thing], please”. It’s the most useful phrase in Korea.'},
  {t:'build', src:'An iced americano, please', answer:['아이스|aiseu','아메리카노|amerikano','주세요|juseyo'], extra:['물|mul','네|ne'],
   tip:'Korean puts the verb last: “iced americano please-give”.'},
  {t:'match', pairs:[['커피|keopi','coffee'],['우유|uyu','milk'],['차|cha','tea'],['계산|gyesan','paying'],['물|mul','water']]},
  {t:'choice', prompt:'What does this mean?', es:'얼마예요?|Eolmayeyo?', options:['What time is it?','How much is it?','Where is it?'], answer:1,
   tip:'얼마 (eolma) = how much. Prices are in won: 오천 원 (ocheon won) = ₩5,000.'},
  {t:'listen', say:'계산해 주세요|Gyesanhae juseyo', options:['The menu, please','A table, please','The bill, please'], answer:2,
   tip:'Literally “please calculate”. In most Korean cafés, you order and pay at the counter first.'},
  {t:'convo', npc:'Junho', npcEmoji:'👨🏻', scene:'Ordering at a café in Seoul',
   tip:'Order placed and paid, all in Korean. ☕',
   turns:[
    {npc:'어서 오세요! 뭐 드릴까요?|Eoseo oseyo! Mwo deurilkkayo?', en:'Welcome! What can I get you?', choices:[
      {es:'잘 지내요.|Jal jinaeyo.', fb:'That’s “I’m doing well”. He wants your order!'},
      {es:'계산해 주세요.|Gyesanhae juseyo.', fb:'You haven’t ordered yet. That asks for the bill.'},
      {es:'아이스 아메리카노 주세요.|Aiseu amerikano juseyo.', ok:true}]},
    {npc:'드시고 가세요?|Deusigo gaseyo?', en:'Is it for here?', choices:[
      {es:'우유요.|Uyuyo.', fb:'He asked if it’s for here. “Takeout” is 포장 (pojang).'},
      {es:'아니요, 포장이요.|Aniyo, pojang-iyo.', ok:true}]},
    {npc:'오천 원입니다.|Ocheon wonimnida.', en:'That’s 5,000 won.', choices:[
      {es:'여기요. 감사합니다!|Yeogiyo. Gamsahamnida!', ok:true},
      {es:'이름이 뭐예요?|Ireumi mwoyeyo?', fb:'Maybe not the moment to ask his name. 😅 Pay first!'}]}
   ]}
  ]},
{ id:'around', title:'Getting Around', emoji:'🧭', color:'#2A9D8F',
  desc:'Ask where things are and understand directions. Ends with asking a halmeoni for help in Busan.',
  words:['어디예요?|eodiyeyo?','왼쪽|oenjjok','오른쪽|oreunjjok','쭉|jjuk'],
  ex:[
  {t:'choice', prompt:'Which one is “the station”?', options:[{e:'🏨',w:'호텔|hotel'},{e:'🌊',w:'바다|bada'},{e:'🚉',w:'역|yeok'},{e:'🏥',w:'병원|byeongwon'}], answer:2,
   tip:'역 (yeok) = station. Subway station names end in 역, like 서울역 (Seoul-yeok).'},
  {t:'choice', prompt:'What does this mean?', es:'화장실 어디예요?|Hwajangsil eodiyeyo?', options:['Is this the bathroom?','Where is the bathroom?','When does the bathroom open?'], answer:1,
   tip:'어디 (eodi) = where. Pattern: [place] 어디예요?'},
  {t:'build', src:'Please go left', answer:['왼쪽으로|oenjjogeuro','가세요|gaseyo'], extra:['오른쪽으로|oreunjjogeuro','여기|yeogi'],
   tip:'왼쪽 (oenjjok) = left, 오른쪽 (oreunjjok) = right. 으로 (euro) means “towards”.'},
  {t:'listen', say:'쭉 가세요|Jjuk gaseyo', options:['Go right','Go straight ahead','Go back'], answer:1,
   tip:'쭉 (jjuk) = straight on. You’ll also hear 직진 (jikjin), which drivers use.'},
  {t:'match', pairs:[['왼쪽|oenjjok','left'],['오른쪽|oreunjjok','right'],['가까워요|gakkawoyo','it’s near'],['멀어요|meoreoyo','it’s far'],['여기|yeogi','here']]},
  {t:'build', src:'Is it far from here?', answer:['여기서|yeogiseo','멀어요?|meoreoyo?'], extra:['가까워요|gakkawoyo','어디|eodi'],
   tip:'Korean questions often look like statements. Just raise your voice at the end: 멀어요? (is it far?)'},
  {t:'convo', npc:'Halmeoni', npcEmoji:'👵🏻', scene:'Lost in Busan',
   tip:'You found your way without opening a map app. 🧭',
   turns:[
    {npc:'괜찮아요? 도와줄까요?|Gwaenchanayo? Dowajulkkayo?', en:'Are you OK? Shall I help you?', choices:[
      {es:'네, 역 어디예요?|Ne, yeok eodiyeyo?', ok:true},
      {es:'아이스 아메리카노 주세요.|Aiseu amerikano juseyo.', fb:'She’s a helpful stranger, not a barista! ☕'}]},
    {npc:'쭉 가서 오른쪽으로 가세요.|Jjuk gaseo oreunjjogeuro gaseyo.', en:'Go straight, then go right.', choices:[
      {es:'잘 지내요?|Jal jinaeyo?', fb:'Ask about the directions instead: is it far?'},
      {es:'여기서 멀어요?|Yeogiseo meoreoyo?', ok:true}]},
    {npc:'아니요, 가까워요. 오 분이에요.|Aniyo, gakkawoyo. O bunieyo.', en:'No, it’s close. Five minutes.', choices:[
      {es:'왼쪽으로 가세요.|Oenjjogeuro gaseyo.', fb:'Now you’re giving her directions! Just thank her.'},
      {es:'정말 감사합니다!|Jeongmal gamsahamnida!', ok:true}]}
   ]}
  ]},
{ id:'friends', title:'Making Friends', emoji:'🎉', color:'#E76FAE',
  desc:'Talk about where you’re from and what you like. Ends with making weekend plans.',
  words:['친구|chingu','좋아해요|joahaeyo','어디에서 왔어요?|eodieseo wasseoyo?','갈래요?|gallaeyo?'],
  ex:[
  {t:'choice', prompt:'Which one is “friend”?', options:[{e:'🐶',w:'강아지|gangaji'},{e:'🧑‍🤝‍🧑',w:'친구|chingu'},{e:'🏠',w:'집|jip'},{e:'📚',w:'책|chaek'}], answer:1,
   tip:'친구 (chingu) is a friend your own age. In Korea, age matters a lot in friendships!'},
  {t:'build', src:'I like music', answer:['저는|jeoneun','음악을|eumageul','좋아해요|joahaeyo'], extra:['싫어해요|sireohaeyo','친구|chingu'],
   tip:'The verb goes last again: “I music like”. 을/를 (eul/reul) marks the thing you like.'},
  {t:'listen', say:'어디에서 왔어요?|Eodieseo wasseoyo?', options:['Where are you going?','Where do you live?','Where are you from?'], answer:2,

  {t:'match', pairs:[['강아지|gangaji','puppy'],['고양이|goyangi','cat'],['음악|eumak','music'],['책|chaek','book'],['바다|bada','sea']]},
  {t:'choice', prompt:'How do you say “I’m from Australia”?', options:['호주에 가요|Hoju-e gayo','호주에서 왔어요|Hoju-eseo wasseoyo','호주 좋아해요|Hoju joahaeyo'], answer:1,

  {t:'build', src:'Wanna go to the beach?', answer:['바다에|bada-e','갈래요?|gallaeyo?'], extra:['집에|jibe','왔어요|wasseoyo'],
   tip:'갈래요? (gallaeyo?) is a casual, friendly way to invite someone: “wanna go?”.'},
  {t:'convo', npc:'Seojun', npcEmoji:'🧑🏻', scene:'At a friend’s party',
   tip:'New friend unlocked. Beach on Saturday! 🏖️',
   turns:[
    {npc:'안녕하세요! 어디에서 왔어요?|Annyeonghaseyo! Eodieseo wasseoyo?', en:'Hi! Where are you from?', choices:[
      {es:'호주에 가요.|Hoju-e gayo.', fb:'That means “I’m going to Australia”. Use 에서 왔어요 (eseo wasseoyo).'},
      {es:'호주에서 왔어요.|Hoju-eseo wasseoyo.', ok:true}]},
    {npc:'와! 뭐 좋아해요?|Wa! Mwo joahaeyo?', en:'Wow! What do you like?', choices:[
      {es:'음악하고 바다를 좋아해요.|Eumakhago badareul joahaeyo.', ok:true},
      {es:'음악을 싫어해요.|Eumageul sireohaeyo.', fb:'That means “I hate music”! Use 좋아해요 (joahaeyo).'}]},
    {npc:'저도요! 토요일에 바다에 갈래요?|Jeodoyo! Toyoire bada-e gallaeyo?', en:'Me too! Wanna go to the beach on Saturday?', choices:[
      {es:'계산해 주세요.|Gyesanhae juseyo.', fb:'Ha, wrong scene! He’s inviting you to the beach.'},
      {es:'좋아요!|Joayo!', ok:true}]}
   ]}
  ]}
]},

zh:{ name:'Mandarin', flag:'🇨🇳', voice:'zh-CN', hello:'你好！|Nǐ hǎo!', unit:'Survive your first trip', group:'East Asian languages', rom:true, join:'', lessons:[
{ id:'greet', title:'First Hellos', emoji:'👋', color:'#FF6B4A',
  desc:'Say hi, introduce yourself, and finish with a real chat with Xiaoyu at a hostel in Shanghai.',
  words:['你好|nǐ hǎo','谢谢|xièxie','你好吗？|nǐ hǎo ma?','我叫|wǒ jiào'],
  ex:[
  {t:'choice', prompt:'Which one means “hello”?', options:[{e:'👋',w:'你好|nǐ hǎo'},{e:'🚪',w:'再见|zàijiàn'},{e:'🙏',w:'谢谢|xièxie'},{e:'🙇',w:'对不起|duìbuqǐ'}], answer:0,
   tip:'你好 (nǐ hǎo) literally means “you good”. Mandarin has 4 tones, and the marks over the letters show which one to use.'},
  {t:'listen', say:'谢谢|Xièxie', options:['Thank you','Sorry','Goodbye'], answer:0,
   tip:'The reply to thanks is 不客气 (bú kèqi), “you’re welcome”.'},
  {t:'build', src:'Nice to meet you', answer:['很|hěn','高兴|gāoxìng','认识|rènshi','你|nǐ'], extra:['再见|zàijiàn','我|wǒ'],
   tip:'Literally “very happy to know you”.'},
  {t:'match', pairs:[['你好|nǐ hǎo','hello'],['再见|zàijiàn','goodbye'],['谢谢|xièxie','thank you'],['对不起|duìbuqǐ','sorry'],['好|hǎo','good']]},
  {t:'choice', prompt:'What does this mean?', es:'你好吗？|Nǐ hǎo ma?', options:['How are you?','Where are you?','Who are you?'], answer:0,
   tip:'Add 吗 (ma) to the end of any sentence to turn it into a yes/no question.'},
  {t:'build', src:'My name is Alex', answer:['我|wǒ','叫|jiào','亚历克斯|Yàlìkèsī'], extra:['你|nǐ','是|shì'],
   tip:'叫 (jiào) = to be called. Foreign names get a Chinese version based on how they sound: Alex → 亚历克斯.'},
  {t:'convo', npc:'Xiaoyu', npcEmoji:'👩🏻', scene:'Meeting someone at a hostel in Shanghai',
   tip:'You just held your first real conversation in Mandarin!',
   turns:[
    {npc:'你好！我叫小雨。你叫什么名字？|Nǐ hǎo! Wǒ jiào Xiǎoyǔ. Nǐ jiào shénme míngzi?', en:'Hi! I’m Xiaoyu. What’s your name?', choices:[
      {es:'我二十岁。|Wǒ èrshí suì.', fb:'That means “I’m 20 years old”. She asked your name. Try 我叫… (wǒ jiào…).'},
      {es:'我叫亚历克斯。|Wǒ jiào Yàlìkèsī.', ok:true},
      {es:'再见！|Zàijiàn!', fb:'You just said goodbye before saying hello! 😄'}]},
    {npc:'很高兴认识你！你好吗？|Hěn gāoxìng rènshi nǐ! Nǐ hǎo ma?', en:'Nice to meet you! How are you?', choices:[
      {es:'我很好，你呢？|Wǒ hěn hǎo, nǐ ne?', ok:true},
      {es:'我叫很好。|Wǒ jiào hěn hǎo.', fb:'叫 (jiào) is only for names. Say 我很好 (wǒ hěn hǎo).'}]},
    {npc:'太好了！回头见。|Tài hǎo le! Huítóu jiàn.', en:'Great! See you later.', choices:[
      {es:'你叫什么名字？|Nǐ jiào shénme míngzi?', fb:'You already know her name: Xiaoyu!'},
      {es:'回头见！|Huítóu jiàn!', ok:true}]}
   ]}
  ]},
{ id:'cafe', title:'At the Café', emoji:'☕', color:'#C0763A',
  desc:'Order, ask the price, and pay. Ends with ordering from Xiao Li at a café in Beijing.',
  words:['咖啡|kāfēi','我要|wǒ yào','多少钱？|duōshao qián?','带走|dàizǒu'],
  ex:[
  {t:'choice', prompt:'Which one is “coffee”?', options:[{e:'💧',w:'水|shuǐ'},{e:'☕',w:'咖啡|kāfēi'},{e:'🥟',w:'包子|bāozi'},{e:'🍵',w:'茶|chá'}], answer:1,
   tip:'咖啡 (kāfēi) sounds like “coffee”. Lots of borrowed words work this way.'},
  {t:'listen', say:'我要一杯水|Wǒ yào yì bēi shuǐ', options:['I want a coffee','I want a glass of water','I want the bill'], answer:1,
   tip:'杯 (bēi) is a measure word for cups and glasses. Mandarin needs one between a number and a noun.'},
  {t:'build', src:'I want a coffee', answer:['我|wǒ','要|yào','一杯|yì bēi','咖啡|kāfēi'], extra:['茶|chá','你|nǐ'],
   tip:'要 (yào) = want. The order is I + want + one cup + coffee.'},
  {t:'match', pairs:[['咖啡|kāfēi','coffee'],['牛奶|niúnǎi','milk'],['茶|chá','tea'],['买单|mǎidān','pay the bill'],['水|shuǐ','water']]},
  {t:'choice', prompt:'What does this mean?', es:'多少钱？|Duōshao qián?', options:['What time is it?','How much is it?','Where is it?'], answer:1,
   tip:'Literally “how much money?”. Prices are in 块 (kuài), the everyday word for yuan.'},
  {t:'listen', say:'服务员，买单！|Fúwùyuán, mǎidān!', options:['Waiter, the menu!','Waiter, a table!','Waiter, the bill!'], answer:2,
   tip:'Calling out 服务员 (fúwùyuán, waiter) is totally normal in China. Many places also let you pay by scanning a QR code.'},
  {t:'convo', npc:'Xiao Li', npcEmoji:'👨🏻', scene:'Ordering at a café in Beijing',
   tip:'Order placed and paid, all in Mandarin. ☕',

function say(text, slow){
  try{
    const u = new SpeechSynthesisUtterance(TX(text));
    const C = course();
    u.lang = C.voice; u.rate = slow ? 0.55 : 0.92;
    const v = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().startsWith(C.voice.slice(0,2)));
    if (v) u.voice = v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}
let AC;
function tone(notes, type, vol){
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime;
    notes.forEach((f,i) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.value = f;
      const s = t + i*0.09;
      g.gain.setValueAtTime(0.0001, s);
      g.gain.exponentialRampToValueAtTime(vol, s+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, s+0.2);
      o.connect(g).connect(AC.destination); o.start(s); o.stop(s+0.22);
    });
  }catch(e){}
}
const sfx = ok => ok ? tone([660,880],'sine',0.18) : tone([233,196],'triangle',0.15);

/* ---------- streak, goal, review ---------- */
function shownStreak(){
  const y = new Date(Date.now()-864e5).toLocaleDateString('en-CA');
  return (S.last===today() || S.last===y) ? S.streak : 0;
}
function bumpStreak(){
  const t = today(); if (S.last === t) return;
  const y = new Date(Date.now()-864e5).toLocaleDateString('en-CA');
  S.streak = S.last===y ? S.streak+1 : 1; S.last = t;
}
function cycleGoal(){
  const g=[10,20,30,50]; S.goal = g[(g.indexOf(S.goal)+1)%g.length]; save();
  renderHome(); toast(`🎯 Daily goal: ${S.goal} XP`);
}
function addMistake(id){ S.mistakes[id] = {box:0, due:Date.now()}; save(); }
function promote(id){
  const m = S.mistakes[id]; if(!m) return;
  m.box++;
  if (m.box >= 3) delete S.mistakes[id];
  else m.due = Date.now() + [0, 60e3, 10*60e3][m.box];   // demo-friendly intervals
  save();
}
const dueList = () => Object.keys(S.mistakes).filter(id => ALL[id] && ALL[id].lang===S.lang && S.mistakes[id].due <= Date.now());
// build answers: a plain sentence (split on spaces) or an explicit token array (for scripts without spaces)
function answerToks(e){
  if (Array.isArray(e.answer)) return [...e.answer];
  // keep a lone "?" or "!" (French spacing) attached to the word before it
  return e.answer.split(' ').reduce((a,t) => { if(/^[?!]$/.test(t) && a.length) a[a.length-1] += ' '+t; else a.push(t); return a; }, []);
}
function buildAnswer(e){   // "text|pronunciation" for the whole sentence
  const toks = answerToks(e).map(sp), j = (COURSES[e.lang].join ?? ' ');
  const r = toks.map(t=>t.r).filter(Boolean).join(' ');
  return toks.map(t=>t.t).join(j) + (r ? '|'+r : '');
}
function label(e){
  if(e.t==='build') return TL(buildAnswer(e));
  if(e.t==='listen') return '🔊 '+TL(e.say);
  if(e.t==='choice') return TL(e.es || O(e.options[e.answer]).w);
  if(e.t==='match') return e.pairs.map(p=>TX(p[0])).join(' · ');
  return '💬 Chat with '+e.npc;
}

  </div>
  <div class="more"><b>🏁 Coming next:</b> <span class="mut">Food & Markets · Travel Trouble · Work Talk</span></div>`;
}
function reviewView(){
  const due = dueList(), all = Object.keys(S.mistakes).filter(id=>ALL[id] && ALL[id].lang===S.lang);
  return `
  <div class="card">
    <h3>🧠 Smart Review</h3>
    <p class="mut">Every mistake you make becomes a card. Get it right 3 times and it graduates. You never lose a heart here, because there are no hearts.</p>
    <button class="btn pri" onclick="startReview()">${due.length?`Review ${due.length} weak spot${due.length>1?'s':''}`:'Quick practice mix'}</button>
  </div>
  <div class="card">
    <h3>Your weak spots</h3>
    ${all.length ? all.map(id => `<div class="weak"><span>${label(ALL[id])}</span><span class="dots">${[0,1,2].map(k=>`<i class="${S.mistakes[id].box>k?'on':''}"></i>`).join('')}</span></div>`).join('')
      : `<p class="mut">Nothing yet. Go make some mistakes. Seriously, that’s how this works.</p>`}
  </div>`;
}
function whyView(){
  const row = f => `<div class="feat"><div class="fi">${f[0]}</div><div><b>${f[1]}</b><p>${f[2]}</p></div></div>`;
  return `
  <div class="card"><h3>✨ What makes Sayso better</h3>${FEATS.map(row).join('')}</div>
  <div class="card"><h3>🚀 Roadmap</h3>${ROADMAP.map(row).join('')}</div>
  <div class="card"><h3>🛠️ Demo controls</h3>
    <p class="mut">Handy when you’re presenting to judges.</p>
    <button class="btn ghost" onclick="S.unlockAll=!S.unlockAll;save();renderHome();toast(S.unlockAll?'🔓 All lessons unlocked':'🔒 Lessons locked')">${S.unlockAll?'Lock lessons again':'Unlock all lessons'}</button>
    <button class="btn ghost" style="color:var(--bad)" onclick="confirmReset()">Reset all progress</button>
  </div>`;
}
function confirmReset(){
  overlay(`<h2>Reset everything?</h2><p class="mut">XP, streak, completed lessons and review cards will be cleared.</p>
  <button class="btn bad" onclick="S={xp:0,today:0,todayDate:today(),streak:0,last:'',done:[],mistakes:{},goal:30,unlockAll:false,lang:''};save();closeOv();tab='learn';renderHome();toast('Fresh start ✨')">Reset</button>
  <button class="btn ghost" onclick="closeOv()">Cancel</button>`);
}
function openLesson(i){
  const L = course().lessons[i];
  overlay(`<div class="bigem" style="background:${L.color}">${L.emoji}</div><h2>${L.title}</h2>
  <p class="mut">${L.desc}</p>
  <div class="pills">${L.words.map(w=>`<span>${TL(w)}</span>`).join('')}</div>
  <button class="btn pri" onclick="closeOv();startLesson('${L.key}')">Start · up to ${L.ex.length*20} XP</button>
  <button class="btn ghost" onclick="closeOv()">Not now</button>`);
}

/* ---------- lesson engine ---------- */
function prep(e){
  if(e.t==='build'){
    e.toks = answerToks(e);
    e.bank = shuffle([...e.toks, ...(e.extra||[])]);
  }
  if(e.t==='match'){ e.left = shuffle(e.pairs.map((_,i)=>i)); e.right = shuffle(e.pairs.map((_,i)=>i)); }
  if(e.t==='choice'||e.t==='listen') e.order = e.options.map((_,i)=>i);
  return e;
}
function startLesson(id){
  const L = course().lessons.find(l=>l.key===id);
  begin(L.ex.map(e=>prep({...e})), L.key, false);
}
function startReview(){
  const ids = dueList(); let q;
  if (ids.length) q = shuffle(ids).slice(0,10).map(id=>prep({...ALL[id]}));
  else {
    let pool = Object.values(ALL).filter(e => e.t!=='convo' && e.lang===S.lang && S.done.includes(e.id.split('-')[0]));
    if (!pool.length) pool = course().lessons[0].ex.filter(e => e.t!=='convo');
    q = shuffle(pool).slice(0,8).map(e=>prep({...e}));
  }
  begin(q, null, true);
}
function begin(queue, lessonId, isReview){
  run = {queue, i:0, lessonId, isReview, xp:0, combo:0, best:0, right:0, wrong:0, start:Date.now(), retried:new Set(), missed:new Set()};
  renderEx();
}
const cur = () => run.queue[run.i];

function renderEx(){
  const e = cur();
  run.sel = e.t==='build' ? [] : null;
  run.state = 'answer'; run.ok = null;
  run.m = {left:null, done:new Set(), errs:0};
  run.c = {turn:0, log:[], miss:false, bad:null, hint:null};
  app.innerHTML = `<div class="lesson">
    <div class="lbar"><button class="x" onclick="quit()" aria-label="Quit">✕</button>
      <div class="prog"><i style="width:${run.i/run.queue.length*100}%"></i></div>
      ${course().rom?`<button class="romt ${S.rom!==false?'on':''}" onclick="toggleRom(this)" title="Show or hide pronunciation">Aa</button>`:''}
      <div class="combo ${run.combo>=3?'on':''}">🔥${run.combo}</div></div>
    <div class="ex" id="ex"></div>
    <div class="foot" id="foot"></div></div>`;
  drawEx(); drawFoot();
  if (e.t==='listen') say(e.say);
  if (e.t==='convo') say(e.turns[0].npc);
}

function drawEx(){
  const e = cur(), box = $('#ex'), done = run.state==='done';
  let h = '';
  if (e.t==='choice' || e.t==='listen'){
    const pics = !!O(e.options[0]).e;
    if (e.t==='choice'){
      h += `<h2>${e.prompt}</h2>`;
      if (e.es) h += `<div class="srcrow">${MASCOT()}<div class="bubble">${TL(e.es)}<button onclick="say(cur().es)" aria-label="Play">🔊</button></div></div>`;
    } else {
      h += `<h2>What do you hear?</h2><div class="speak"><button class="big" onclick="say(cur().say)" aria-label="Play">🔊</button><button class="slow" onclick="say(cur().say,1)" aria-label="Play slowly">🐢</button></div>`;
    }
    h += `<div class="grid ${pics?'pics':'list'}">${e.order.map(i => {
      const o = O(e.options[i]);
      let cls = run.sel===i ? 'sel' : '';
      if (done){ cls = i===e.answer ? 'right' : (i===run.sel ? 'wrong' : ''); }
      return `<button class="opt ${cls}" onclick="pick(${i})">${o.e?`<span class="em">${o.e}</span>`:''}<span>${TL(o.w)}</span></button>`;
    }).join('')}</div>`;
  }
  if (e.t==='build'){
    h += `<h2>Translate this</h2><div class="srcrow">${MASCOT()}<div class="bubble">${e.src}</div></div>
    <div class="answer ${done?(run.ok?'right':'wrong'):''}">${run.sel.map((bi,k)=>`<button class="tok" onclick="unbuild(${k})">${TL(e.bank[bi])}</button>`).join('')}</div>
    <div class="bank">${e.bank.map((w,bi)=>`<button class="tok ${run.sel.includes(bi)?'ghost':''}" onclick="build(${bi})">${TL(w)}</button>`).join('')}</div>`;
  }
  if (e.t==='match'){
    h += `<h2>Tap the matching pairs</h2><div class="match">
      <div>${e.left.map(i=>`<button class="tok mt ${run.m.done.has(i)?'gone':''} ${run.m.left===i?'sel':''}" id="L${i}" onclick="mL(${i})">${TL(e.pairs[i][0])}</button>`).join('')}</div>
      <div>${e.right.map(i=>`<button class="tok mt ${run.m.done.has(i)?'gone':''}" id="R${i}" onclick="mR(${i})">${e.pairs[i][1]}</button>`).join('')}</div></div>`;
  }
  if (e.t==='convo'){
    const turn = e.turns[run.c.turn];
    const bub = m => m.who==='me'
      ? `<div class="b me">${TL(m.es)}</div>`
      : `<div class="b npc" data-say="${TX(m.es)}" onclick="this.classList.toggle('show')">${TL(m.es)}<button class="sp" onclick="event.stopPropagation();say(this.parentNode.dataset.say)" aria-label="Play">🔊</button><small class="en">${m.en}</small></div>`;
    h += `<div class="convo-head"><div class="av">${e.npcEmoji}</div><div><b>${e.npc}</b><small>${e.scene}</small></div></div>
      <div class="tapt">Tap a message to see the translation</div>
      <div class="chat">${run.c.log.map(bub).join('')}${turn?bub({who:'npc',es:turn.npc,en:turn.en}):''}</div>`;
    if (turn && !done){
      h += `<div class="replies">${turn.choices.map((c,k)=>`<button class="opt reply ${run.c.bad===k?'bad':''}" onclick="reply(${k})">${TL(c.es)}</button>`).join('')}</div>`;
      if (run.c.hint) h += `<div class="hint">💡 ${run.c.hint}</div>`;
    }
  }
  box.innerHTML = h;
  if (e.t==='convo') box.scrollTop = box.scrollHeight;
}

function drawFoot(){
  const e = cur(), f = $('#foot'); f.className = 'foot';
  if (e.t==='match' || e.t==='convo'){ f.innerHTML = `<button class="btn ghost" onclick="finishEx(false)">Skip</button>`; return; }
  const can = e.t==='build' ? run.sel.length>0 : run.sel!==null;
  f.innerHTML = `<button class="btn pri" ${can?'':'disabled'} onclick="check()">Check</button>`;
}

function pick(i){
  if (run.state!=='answer') return;
  run.sel = i; const o = O(cur().options[i]);
  if (o.e) say(o.w);
  drawEx(); drawFoot();
}
function build(bi){
  if (run.state!=='answer' || run.sel.includes(bi)) return;
  run.sel.push(bi); drawEx(); drawFoot();
}
function unbuild(k){
  if (run.state!=='answer') return;
  run.sel.splice(k,1); drawEx(); drawFoot();
}
function mL(i){
  if (run.m.done.has(i)) return;
  run.m.left = i; say(cur().pairs[i][0]); drawEx();
}
function mR(i){
  const e = cur();
  if (run.m.left===null){ toast('Pick a word on the left first 👈'); return; }
  if (run.m.left===i){
    run.m.done.add(i); run.m.left = null; tone([784],'sine',0.12); drawEx();
    if (run.m.done.size===e.pairs.length) setTimeout(()=>finishEx(run.m.errs<2), 250);
  } else {
    run.m.errs++; const l = run.m.left; run.m.left = null; tone([220],'triangle',0.1);
    drawEx();
    ['L'+l,'R'+i].forEach(id => { const el=document.getElementById(id); if(el){ el.classList.add('err'); setTimeout(()=>el.classList.remove('err'),400);} });
  }
}
function reply(k){
  const e = cur(), turn = e.turns[run.c.turn], c = turn.choices[k];
  if (c.ok){
    run.c.log.push({who:'npc', es:turn.npc, en:turn.en}, {who:'me', es:c.es});
    run.c.turn++; run.c.bad = null; run.c.hint = null;
    tone([660],'sine',0.12);
    if (run.c.turn >= e.turns.length){ drawEx(); setTimeout(()=>finishEx(!run.c.miss), 350); }
    else { drawEx(); setTimeout(()=>say(e.turns[run.c.turn].npc), 300); }
  } else {
    run.c.miss = true; run.c.bad = k; run.c.hint = c.fb; sfx(false); drawEx();
  }
}
function check(){
  const e = cur(); let ok = false;
  if (e.t==='choice' || e.t==='listen') ok = run.sel===e.answer;
  if (e.t==='build'){
    const got = run.sel.map(b=>norm(TX(e.bank[b]))), want = e.toks.map(t=>norm(TX(t)));
    ok = got.length===want.length && got.every((w,i)=>w===want[i]);
  }
  finishEx(ok);
}
function answerText(e){
  if (e.t==='choice' || e.t==='listen') return TL(O(e.options[e.answer]).w);
  if (e.t==='build') return TL(buildAnswer(e));
  return '';
}
const PRAISE = ['Nice!','¡Perfecto!','¡Muy bien!','Nailed it!','¡Excelente!','¡Eso es!'];
function finishEx(ok){
  const e = cur(); if (run.state==='done') return;
  run.state = 'done'; run.ok = ok;
  let gain = 0;
  if (ok){
    run.combo++; run.best = Math.max(run.best, run.combo);
    gain = run.combo>=3 ? 20 : 10; run.xp += gain; run.right++;
    if (run.isReview) promote(e.id);
  } else {
    run.combo = 0; run.wrong++; run.missed.add(e.id); addMistake(e.id);
    if (e.t!=='convo' && !run.retried.has(e.id)){ run.retried.add(e.id); run.queue.push(prep({...ALL[e.id]})); }
  }
  // convo with a slip still counts as a mistake card, but you finished it
  if (ok && e.t==='convo' && run.c.miss){ addMistake(e.id); }
  sfx(ok);
  drawEx();
  document.querySelector('.prog i').style.width = ((run.i+1)/run.queue.length*100)+'%';
  const cb = $('.combo'); cb.textContent = '🔥'+run.combo; cb.className = 'combo'+(run.combo>=3?' on':'');
  const f = $('#foot'); f.className = 'foot '+(ok?'good':'bad');
  const ans = answerText(e);
  f.innerHTML = ok
    ? `<div class="fbt">✅ ${PRAISE[Math.floor(Math.random()*PRAISE.length)]} ${gain>10?'<span class="x2">COMBO ×2 · +20 XP</span>':''}</div>
       ${e.tip?`<div class="why">💡 ${e.tip}</div>`:''}
       <button class="btn good" onclick="next()">Continue</button>`
    : `<div class="fbt">💪 Not quite</div>
       ${ans?`<p>Correct answer: <b>${ans}</b></p>`:''}
       ${e.tip?`<div class="why"><b>Why?</b> ${e.tip}</div>`:''}
       <p class="saved">🧠 Saved to Smart Review. You’ll see this again${e.t!=='convo'?' at the end of the lesson':''}.</p>
       <button class="btn bad" onclick="next()">Got it</button>`;
}
function next(){
  run.i++;
  if (run.i >= run.queue.length) finishLesson(); else renderEx();
}
function quit(){
  overlay(`<h2>Leave the lesson?</h2><p class="mut">You’ll lose the XP from this lesson.</p>
  <button class="btn pri" onclick="closeOv()">Keep learning</button>
  <button class="btn ghost" style="color:var(--bad)" onclick="closeOv();renderHome()">Quit</button>`);
}
function finishLesson(){
  const before = S.today;
  S.xp += run.xp; S.today += run.xp; bumpStreak();
  if (run.lessonId && !S.done.includes(run.lessonId)) S.done.push(run.lessonId);
  save();
  const acc = Math.round(100*run.right/Math.max(1, run.right+run.wrong));
  const secs = Math.round((Date.now()-run.start)/1000);
  const hit = before < S.goal && S.today >= S.goal;
  const missed = run.missed.size;
  app.innerHTML = `<div class="finish">
    ${MASCOT('m')}
    <h1>${acc===100?'¡Perfecto!':run.isReview?'Review done!':'Lesson complete!'}</h1>
    <p class="mut">${hit?'🎯 Daily goal smashed!':S.today>=S.goal?'🎯 Daily goal already done. Overachiever!':`${S.goal-S.today} XP to go for today’s goal`} · 🔥 ${S.streak} day streak</p>
    <div class="stats">
      <div class="stat" style="--c:var(--gold)"><b>XP earned</b><span>+${run.xp}</span></div>
      <div class="stat" style="--c:var(--good)"><b>Accuracy</b><span>${acc}%</span></div>
      <div class="stat" style="--c:var(--coral)"><b>Best combo</b><span>🔥${run.best}</span></div>
      <div class="stat" style="--c:var(--vio)"><b>Time</b><span>${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}</span></div>
    </div>
    ${missed?`<p class="mut" style="margin-bottom:12px">🧠 ${missed} item${missed>1?'s':''} saved to Smart Review</p>`:''}
    <button class="btn pri" onclick="tab='${missed?'review':'learn'}';renderHome()">Continue</button>
  </div>`;
  confetti(); sfxWin();
}

renderHome();
try{ speechSynthesis.getVoices(); }catch(e){}
// installable app + offline lessons (skipped where service workers aren't allowed)
try{ if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
</script>
